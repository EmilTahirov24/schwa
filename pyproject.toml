[project]
name = "duzelt-workspace"
version = "0.0.0"
description = "Development workspace for duzelt"
requires-python = ">=3.12"
dependencies = ["duzelt"]

[tool.uv.workspace]
members = ["packages/core"]

[tool.uv.sources]
duzelt = { workspace = true }
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "poethepoet>=0.29",
    "mwparserfromhell>=0.7.2",
]
train = [
    "numpy>=2.5.2",
    "torch>=2.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests"]

[tool.poe.tasks]
test = "pytest"
lint = "ruff check ."
fmt = "ruff format ."
check = ["lint", "test"]

# The pipeline, in order. Each step reads what the previous one wrote.
extract = "python scripts/extract_wiki.py"
corpus = "python scripts/build_corpus.py"
lexicon = "python scripts/build_lexicon.py"
context = "python scripts/train_context.py"
eval = "python scripts/evaluate.py --split dev"
data = ["extract", "corpus", "lexicon"]
train = ["context"]
reproduce = ["data", "train", "eval"]
