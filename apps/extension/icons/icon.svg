<!--
  The source the PNG icons are rendered from. The shapes are drawn again in
  scripts/make_icons.py rather than converted, so keep the two in step.

  The mark is a schwa - ə - because it is the letter people drop most often and the one the
  tool is best known for putting back. A schwa is a rotated "e", so the ring opens at the
  upper left and the bar sits below the centre. The stroke stays heavy so the shape survives
  at 16px, where a thinner letter turns to mush.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" rx="28" fill="#171717" />
  <g fill="none" stroke="#fafafa" stroke-width="13" stroke-linecap="round">
    <path d="M50.9 37.9 A31 31 0 1 1 34.9 55.4" />
    <path d="M39.5 76 H88.5" />
  </g>
  <circle cx="98" cy="30" r="10" fill="#34d399" />
</svg>
