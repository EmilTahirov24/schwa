[project]
name = "schwa-workspace"
version = "0.0.0"
description = "Development workspace for schwa"
requires-python = ">=3.12"
dependencies = ["schwa-az", "schwa-api"]

[tool.uv.workspace]
members = ["packages/core", "packages/api"]

[tool.uv.sources]
schwa-az = { workspace = true }
schwa-api = { workspace = true }
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "poethepoet>=0.29",
    "mwparserfromhell>=0.7.2",
    "httpx>=0.28.1",
    "onnxruntime>=1.30.0",
    "numpy>=2.5.2",
]
train = [
    "numpy>=2.5.2",
    "onnx>=1.22.0",
    "pillow>=12.3.0",
    "torch>=2.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "packages/api/tests"]

[tool.poe.tasks]
test = "pytest"
lint = "ruff check ."
fmt = "ruff format ."
check = ["lint", "test"]
# Exactly what CI runs, so a push is not the first place a check fails.
format-check = "ruff format --check ."
ci = ["lint", "format-check", "test"]
serve = "uvicorn schwa_api.main:app --reload"
icons = "python scripts/make_icons.py"

# The pipeline, in order. Each step reads what the previous one wrote. `reproduce` runs all
# of it and rewrites every number in docs/results.md; it needs the train group and a GPU.
extract = "python scripts/extract_wiki.py"
corpus = "python scripts/build_corpus.py"
lexicon = "python scripts/build_lexicon.py"
web = "python scripts/fetch_web.py"
context = "python scripts/train_context.py"
tagger = "python scripts/train_tagger.py"
tagger-web = "python scripts/train_tagger.py --train data/processed/web_train.txt --dev data/processed/web_dev.txt --out models/tagger_web.pt"
tagger-both = "python scripts/train_tagger.py --train data/processed/train.txt data/processed/web_train.txt --dev data/processed/dev.txt data/processed/web_dev.txt --out models/tagger_both.pt --parts 2"
tagger-caps = "python scripts/train_tagger.py --caps 0.05 --out models/tagger_caps.pt"
tagger-both-caps = "python scripts/train_tagger.py --train data/processed/train.txt data/processed/web_train.txt --dev data/processed/dev.txt data/processed/web_dev.txt --caps 0.05 --parts 2 --out models/tagger_both_caps.pt"
export = "python scripts/export_onnx.py"
quantize = "python scripts/quantize_onnx.py"
bundle = "python scripts/build_bundle.py"
eval = [
    { cmd = "python scripts/evaluate.py --split dev" },
    { cmd = "python scripts/evaluate.py --split test" },
    { cmd = "python scripts/evaluate.py --split web_test" },
    { cmd = "python scripts/evaluate_spelling.py --split dev" },
    { cmd = "python scripts/evaluate_spelling.py --split test" },
    { cmd = "python scripts/error_analysis.py --split test" },
    { cmd = "python scripts/error_analysis.py --split web_test" },
    { cmd = "python scripts/text_stats.py --split dev" },
    { cmd = "python scripts/text_stats.py --split test" },
    { cmd = "python scripts/text_stats.py --split web_test" },
]
domain = "python scripts/domain_shift.py --models wikipedia=models/tagger.pt web=models/tagger_web.pt both=models/tagger_both.pt capitals=models/tagger_caps.pt both+capitals=models/tagger_both_caps.pt"
data = ["extract", "corpus", "lexicon", "web"]
train = ["context", "tagger", "tagger-web", "tagger-both", "tagger-caps", "tagger-both-caps"]
ship = ["export", "quantize", "bundle"]
reproduce = ["data", "train", "ship", "eval", "domain"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends() in a default is the framework's own idiom, not a mutable default.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]
