[project]
name = "duzelt-api"
version = "0.1.0.dev0"
description = "HTTP service that restores Azerbaijani diacritics"
requires-python = ">=3.12"
dependencies = [
    "duzelt",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["duzelt_api"]

[tool.uv.sources]
duzelt = { workspace = true }
