<!doctype html>
<html lang="az">
  <head>
    <meta charset="utf-8" />
    <title>Schwa — parametrlər</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 15px system-ui, sans-serif;
      }
      body {
        max-width: 560px;
        margin: 40px auto;
        padding: 0 20px;
        line-height: 1.6;
      }
      h1 {
        font-size: 20px;
      }
      label {
        display: block;
        margin-top: 20px;
        font-weight: 600;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        margin-top: 6px;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font: inherit;
      }
      small {
        color: #666;
      }
      button {
        margin-top: 20px;
        padding: 8px 16px;
        border: 0;
        border-radius: 6px;
        background: #171717;
        color: #fafafa;
        font: inherit;
        cursor: pointer;
      }
      #saved {
        margin-left: 10px;
        color: #15803d;
      }
    </style>
  </head>
  <body>
    <h1>Parametrlər</h1>

    <label for="api">Servisin ünvanı</label>
    <input id="api" type="url" placeholder="http://127.0.0.1:8000" />
    <small>
      Öz serverini işlədirsənsə, ünvanı burada dəyiş. Mətn yalnız bu ünvana göndərilir və
      yalnız sən düzəltmə əmrini verəndə.
    </small>

    <button id="save">Yadda saxla</button>
    <span id="saved"></span>

    <script src="options.js"></script>
  </body>
</html>
