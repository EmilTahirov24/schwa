[project]
name = "schwa-az"
version = "0.1.0"
description = "Restore Azerbaijani diacritics in text typed without them"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Emil Tahirov" }]
keywords = ["azerbaijani", "diacritics", "nlp", "text-restoration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
# The tagger needs a runtime; without it the package falls back to the lexicon alone.
onnx = ["onnxruntime>=1.17", "numpy>=1.26"]

[project.scripts]
schwa = "schwa.cli:main"

[project.urls]
Homepage = "https://emiltahirov24.github.io/schwa/"
Source = "https://github.com/EmilTahirov24/schwa"
Issues = "https://github.com/EmilTahirov24/schwa/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The bundled model is generated, so it is not in git and has to be named explicitly.
artifacts = ["schwa/data/*"]

[tool.hatch.build.targets.wheel]
packages = ["schwa"]
