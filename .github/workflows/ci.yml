name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # The bundled model is committed, so this includes the tests that run it.
      - name: Test
        run: uv run pytest -q

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json

      - run: npm ci

      - name: Copy in the runtime and the bundled model
        run: npm run vendor

      # Includes the parity tests: the shipped model through onnxruntime-web must answer
      # exactly as the Python package recorded in test/fixtures.
      - run: npm test

      # The packed extension in the runner's Chrome, restoring text with its own model.
      - name: Test the extension in Chrome
        run: npm run pack && npm run e2e
        env:
          CHROME: /usr/bin/google-chrome

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/extension/package-lock.json
            apps/web/package-lock.json

      # The page runs the extension's code, runtime and model; its build copies them over.
      - name: Prepare the extension
        working-directory: apps/extension
        run: npm ci && npm run vendor

      - name: Install
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Build
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /schwa
