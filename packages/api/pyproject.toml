[project]
name = "schwa-api"
version = "0.1.0"
description = "HTTP service that restores Azerbaijani diacritics"
requires-python = ">=3.12"
dependencies = [
    "schwa-az[onnx]",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schwa_api"]

[tool.uv.sources]
schwa-az = { workspace = true }
